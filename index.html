<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>數學三上學習樂園</title>
  <meta name="description" content="四德學輔班 南一版三上數學複習遊戲：跑酷、2 分鐘挑戰、小偵探">
  <meta name="theme-color" content="#F8F6F0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <link rel="stylesheet" href="fonts/zihi/zihi.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 地圖（選關卡） ===== -->
  <main class="screen map" id="map">
    <header class="map-hero">
      <div class="logo" aria-hidden="true">🧮</div>
      <h1><span class="brand">數學</span>三上學習樂園</h1>
      <p><span id="grade-sub">南一版・三年級上學期</span> <button class="say" type="button" data-say="數學三上學習樂園。選一個關卡開始練習吧！" aria-label="念出來">🔊</button></p>
      <div class="total">我的星星 <b id="total-stars">0</b> 顆 ⭐</div>
    </header>
    <div class="settings">
      <div class="dev-switch" role="group" aria-label="手機版或網頁版">
        <button type="button" data-dev="phone">📱 手機版</button><button type="button" data-dev="web">💻 網頁版</button>
      </div>
      <label class="toggle"><input type="checkbox" id="opt-zhuyin"> ㄅ 注音</label>
      <label class="toggle"><input type="checkbox" id="opt-autosay"> 🔊 自動念題目</label>
      <label class="toggle"><input type="checkbox" id="opt-sound"> 🎵 音效</label>
    </div>
    <div id="units"></div>
  </main>

  <!-- ===== 🏃 跑酷（直向：往上跑、左右閃、撞到 Q 出題） ===== -->
  <section class="screen game" id="game" hidden>
    <header class="hud">
      <button class="hud-btn" id="btn-pause" type="button" aria-label="暫停">⏸</button>
      <button class="hud-btn help" id="help-run" type="button" aria-label="再看一次說明">📖</button>
      <div class="hud-mid"><span id="hud-stage"></span><span class="left" id="hud-left"></span></div>
      <div class="combo" id="combo" hidden></div>
      <div class="score">🪙 <b id="score">0</b></div>
    </header>
    <div class="play" id="play">
      <div class="track" id="track">
        <canvas id="cv" aria-label="跑道：左右移動吃金幣、閃開障礙物，撞到 Q 會出題"></canvas>
        <p class="key-hint" id="key-hint">⌨️ 鍵盤 ← → 也可以移動</p>
      </div>
      <nav class="moves">
        <button class="move" type="button" data-dir="-1" aria-label="往左">◀ 左</button>
        <button class="move" type="button" data-dir="1" aria-label="往右">右 ▶</button>
      </nav>
    </div>
  </section>

  <!-- ===== ⏱️ 2 分鐘挑戰 ===== -->
  <section class="screen game" id="timed" hidden>
    <header class="hud">
      <button class="hud-btn" id="t-pause" type="button" aria-label="暫停">⏸</button>
      <button class="hud-btn help" id="help-timed" type="button" aria-label="再看一次說明">📖</button>
      <div class="hud-mid"><span id="t-title"></span></div>
      <div class="combo" id="t-combo" hidden></div>
      <div class="score">✔ <b id="t-count">0</b> 題</div>
    </header>
    <div class="timer" aria-label="剩下的時間"><div class="timer-fill" id="t-fill"></div><span class="timer-sec">⏱️ 剩下 <b id="t-sec">2 分 0 秒</b></span></div>
    <main class="calc">
      <div class="calc-top"><button class="say" type="button" id="t-say" aria-label="念題目">🔊</button><span class="again" id="t-again" hidden>🔁 再算一次</span></div>
      <div class="calc-q" id="t-q"></div>
      <div class="t-msg" id="t-msg" aria-live="polite"></div>
      <button class="big-btn" type="button" id="t-next" hidden>我知道了，下一題 ▶</button>
    </main>
    <nav class="keypad" id="keypad">
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="del" class="k-del" aria-label="刪除">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="k-ok">✔ 確定</button>
    </nav>
  </section>

  <!-- ===== 🔍 小偵探 ===== -->
  <section class="screen game" id="spot" hidden>
    <header class="hud">
      <button class="hud-btn" id="s-pause" type="button" aria-label="暫停">⏸</button>
      <button class="hud-btn help" id="help-spot" type="button" aria-label="再看一次說明">📖</button>
      <div class="hud-mid"><span id="s-title"></span><span class="left" id="s-prog"></span></div>
      <div class="combo" id="s-combo" hidden></div>
      <div class="score">⭐ <b id="s-count">0</b></div>
    </header>
    <main class="calc spot-main">
      <div class="calc-top"><button class="say" type="button" id="s-say" aria-label="念題目">🔊</button><span class="who" id="s-who"></span></div>
      <p class="spot-ask"><button class="say" type="button" data-say="同學算對了嗎？算對了，就按綠色的算對了。算錯了，就點錯的那一位數字。" aria-label="念出來">🔊</button><span>算對了嗎？算錯了就<b>點錯的那一位數字</b>。</span></p>
      <div class="calc-q paper" id="s-q"></div>
      <div class="spot-actions" id="s-actions">
        <button class="big-btn ok-btn" type="button" id="s-ok">✔ 算對了</button>
      </div>
      <div class="spot-result" id="s-result" hidden>
        <div class="say-row"><button class="say" type="button" id="s-res-say" aria-label="念出來">🔊</button><h2 class="s-head" id="s-head"></h2></div>
        <div class="ex-work" id="s-body"></div>
        <button class="big-btn" type="button" id="s-next">下一題 ▶</button>
      </div>
    </main>
  </section>

  <!-- ===== 質數打地鼠 ===== -->
  <section class="screen game" id="mole" hidden>
    <header class="hud">
      <button class="hud-btn" id="m-pause" type="button" aria-label="暫停">⏸</button>
      <button class="hud-btn help" id="help-mole" type="button" aria-label="再看一次說明">📖</button>
      <div class="hud-mid"><span id="m-title"></span></div>
      <div class="combo" id="m-combo" hidden></div>
      <div class="score">⭐ <b id="m-count">0</b></div>
    </header>
    <div class="timer" aria-label="剩下的時間"><div class="timer-fill" id="m-fill"></div><span class="timer-sec">剩下 <b id="m-sec">2 分 0 秒</b></span></div>
    <main class="mole-main">
      <p class="m-ask"><button class="say" type="button" id="m-ask-say" data-say="" aria-label="念出來">🔊</button><span id="m-ask-text"></span></p>
      <div class="m-stage"><div class="m-board" id="m-board"></div><div class="m-banner" id="m-banner" hidden><p id="m-banner-text"></p></div></div>
      <p class="m-msg" id="m-msg" aria-live="polite"></p>
    </main>
  </section>

  <!-- ===== 一局 10 題的小遊戲（快答、點圖、分類、塗色、自己填） ===== -->
  <section class="screen game" id="round" hidden>
    <header class="hud">
      <button class="hud-btn" id="r-pause" type="button" aria-label="暫停">⏸</button>
      <button class="hud-btn help" id="help-round" type="button" aria-label="再看一次說明">📖</button>
      <div class="hud-mid"><span id="r-title"></span><span class="left" id="r-prog"></span></div>
      <div class="combo" id="r-combo" hidden></div>
      <div class="score">⭐ <b id="r-score">0</b></div>
    </header>
    <div class="arena" id="r-arena" aria-hidden="true">
      <div class="ar-fox" id="r-fox"></div>
      <div class="ar-hp"><i id="r-hp"></i></div>
      <div class="ar-mon" id="r-mon"></div>
      <span class="ar-shot" id="r-shot"></span>
    </div>
    <main class="calc round-main">
      <div class="qtext r-q"><button class="say" type="button" id="r-say" aria-label="念題目">🔊</button><span id="r-text"></span></div>
      <div class="qbig" id="r-big" hidden></div>
      <div class="r-visual" id="r-visual"></div>
      <div class="r-fields" id="r-fields"></div>
      <div class="r-opts" id="r-opts"></div>
      <div class="r-fb" id="r-fb" hidden></div>
      <div class="r-stamp" id="r-stamp" aria-hidden="true"></div>
    </main>
    <nav class="keypad" id="r-keypad" hidden>
      <button type="button" data-rk="7">7</button><button type="button" data-rk="8">8</button><button type="button" data-rk="9">9</button>
      <button type="button" data-rk="4">4</button><button type="button" data-rk="5">5</button><button type="button" data-rk="6">6</button>
      <button type="button" data-rk="1">1</button><button type="button" data-rk="2">2</button><button type="button" data-rk="3">3</button>
      <button type="button" data-rk="del" class="k-del" aria-label="刪除">⌫</button><button type="button" data-rk="0">0</button><button type="button" data-rk="ok" class="k-ok">✔ 確定</button>
    </nav>
  </section>

  <!-- ===== 🦊 九九乘法大冒險 ===== -->
  <section class="screen game" id="nine" hidden>
    <header class="hud">
      <button class="hud-btn" id="n-pause" type="button" aria-label="暫停">⏸</button>
      <button class="hud-btn help" id="help-nine" type="button" aria-label="再看一次說明">📖</button>
      <div class="hud-mid"><span id="n-title"></span><span class="left" id="n-left"></span></div>
      <div class="hearts" id="n-hearts"></div>
      <div class="score">⭐ <b id="n-score">0</b></div>
    </header>
    <main class="calc nine-main">
      <div class="n-board" id="n-board"></div>
      <div class="n-play" id="n-play" hidden>
        <div class="n-qrow"><div class="n-q" id="n-q"></div></div>
        <div class="n-msg" id="n-msg" aria-live="polite"></div>
      </div>
    </main>
    <nav class="keypad" id="n-keypad" hidden>
      <button type="button" data-nk="7">7</button><button type="button" data-nk="8">8</button><button type="button" data-nk="9">9</button>
      <button type="button" data-nk="4">4</button><button type="button" data-nk="5">5</button><button type="button" data-nk="6">6</button>
      <button type="button" data-nk="1">1</button><button type="button" data-nk="2">2</button><button type="button" data-nk="3">3</button>
      <button type="button" data-nk="del" class="k-del" aria-label="刪除">⌫</button><button type="button" data-nk="0">0</button><button type="button" data-nk="ok" class="k-ok">✔ 確定</button>
    </nav>
  </section>

  <!-- ===== 遊戲說明（一頁一小塊遊戲畫面＋一句話，自動念；念完才能往下滑） ===== -->
  <div class="overlay" id="ov-tut" hidden>
    <div class="dialog tut-box">
      <h2 id="tut-title"></h2>
      <div id="tut-learn">
        <div class="tut-stage" id="tut-stage">
          <img id="tut-img" alt="" draggable="false">
          <p class="tut-text" id="tut-text"></p>
        </div>
        <div class="tut-dots" id="tut-dots" aria-hidden="true"></div>
        <div class="tut-nav">
          <button class="tut-btn" type="button" id="tut-prev" aria-label="上一頁">◀</button>
          <span class="tut-wait" id="tut-wait" aria-label="聽完這一頁，就可以往下滑">🎧</span>
          <button class="tut-btn next" type="button" id="tut-next" aria-label="下一頁">▶</button>
        </div>
        <span id="tut-page" hidden></span><span id="tut-done" hidden></span>
      </div>
      <div id="tut-menu" hidden>
        <img class="tut-thumb" id="tut-menu-img" alt="遊戲畫面">
        <p class="sub" id="tut-menu-desc"></p>
        <button class="tut-again" type="button" id="tut-again"><span>📖</span>再看一次說明</button>
      </div>
      <div class="tut-start" id="tut-start" hidden></div>
      <button class="big-btn go-btn" type="button" id="tut-resume" aria-label="繼續玩" hidden>▶</button>
      <button class="tut-back" type="button" id="tut-back" aria-label="返回">↩</button>
    </div>
  </div>

  <!-- ===== 撞到 Q：題目（不限時間） ===== -->
  <div class="overlay" id="ov-q" hidden>
    <div class="dialog qdialog">
      <div class="q-badge" aria-hidden="true">?</div>
      <div class="qtext"><button class="say" type="button" id="q-say" aria-label="念題目">🔊</button><span id="q-text"></span></div>
      <div class="qbig" id="q-big" hidden></div>
      <div class="qvisual" id="q-visual" hidden></div>
      <div class="q-opts" id="q-opts">
        <button class="qa" type="button" data-i="0"></button>
        <button class="qa" type="button" data-i="1"></button>
        <button class="qa" type="button" data-i="2"></button>
        <button class="qa" type="button" data-i="3" hidden></button>
      </div>
      <p class="sub">慢慢想，不用急</p>
    </div>
  </div>

  <!-- ===== 倒數 3、2、1 ===== -->
  <div class="countdown" id="ov-count" hidden><span id="count-num">3</span></div>

  <!-- ===== 答錯說明 ===== -->
  <div class="overlay" id="ov-explain" hidden>
    <div class="dialog explain">
      <h2 id="ex-title">差一點！</h2>
      <p class="ex-q" id="ex-q"></p>
      <div class="ex-ans">正確答案是 <b id="ex-ans"></b></div>
      <p class="ex-hint"><button class="say" type="button" id="ex-say" aria-label="念提示">🔊</button><span id="ex-hint"></span></p>
      <div class="ex-work" id="ex-work"></div>
      <p class="sub">這題等一下會再出現一次喔！</p>
      <button class="big-btn" type="button" id="ex-next">我懂了，繼續跑 ▶</button>
    </div>
  </div>

  <!-- ===== 暫停 ===== -->
  <div class="overlay" id="ov-pause" hidden>
    <div class="dialog">
      <div class="say-row"><button class="say" type="button" data-say="休息一下。藍色按鈕，繼續。下面的按鈕，重新開始，或是回關卡地圖。" aria-label="念出來">🔊</button><h2>休息一下 ⏸</h2></div>
      <button class="big-btn" type="button" id="pause-resume">繼續跑 ▶</button>
      <button class="big-btn alt" type="button" id="pause-restart">重新開始</button>
      <button class="big-btn alt" type="button" id="pause-quit">回關卡地圖</button>
    </div>
  </div>

  <!-- ===== 結算 ===== -->
  <div class="overlay" id="ov-end" hidden>
    <div class="dialog end">
      <div class="end-stars" id="end-stars"></div>
      <div class="say-row"><button class="say" type="button" id="end-say" aria-label="念出來">🔊</button><h2 id="end-title"></h2></div>
      <p class="end-score"><span id="end-score"></span> <span class="record" id="end-record" hidden>🎉 新紀錄！</span></p>
      <p class="sub" id="end-best"></p>
      <div class="end-review" id="end-review"></div>
      <button class="big-btn" type="button" id="end-again">再玩一次 🔁</button>
      <button class="big-btn alt" type="button" id="end-map">回關卡地圖</button>
    </div>
  </div>

  <script src="js/site.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/questions56.js"></script>
  <script src="js/zhuyin.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/timed.js"></script>
  <script src="js/spot.js"></script>
  <script src="js/rounds.js"></script>
  <script src="js/nine.js"></script>
  <script src="js/mole.js"></script>
</body>
</html>
